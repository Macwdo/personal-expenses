name: Workspace CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test workspace tooling
        run: make check-tools
      - name: Validate Compose contract
        run: docker compose --env-file .env.example --file compose.yaml config --quiet
